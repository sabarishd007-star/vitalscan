# Render blueprint for the VitalScan ML backend (FastAPI + PyTorch + MediaPipe).
#
# The frontend (React SPA) is deployed on Vercel; this service cannot run there,
# so it is hosted as a Docker web service on Render.
#
# Deploy steps:
#   1. Push this repo to GitHub and import it on Render (Blueprint).
#   2. Set SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY when prompted (or in
#      Dashboard -> Environment after creation).
#   3. Set ALLOWED_ORIGINS to the exact Vercel frontend URL (no wildcard).
#   4. Set MODEL_VALIDATED=true only after the model has been independently
#      validated; until then /analyze-skin returns 503 in production on purpose.
services:
  - type: web
    name: vitalscan-api
    runtime: docker
    repo: https://github.com/sabarishd007-star/vitalscan
    plan: free
    dockerfilePath: ml-backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MODEL_VALIDATED
        value: "false"
      - key: MODEL_VERSION
        value: distilled-cv-v1
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
