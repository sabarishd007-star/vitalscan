project_name: vitalscan
tech_stack:
  framework: React 19 with TypeScript
  build_tool: Vite
  styling: TailwindCSS v4
  routing: react-router-dom v7
  auth: Firebase Authentication (email/password + Google OAuth)
  database: Supabase (health reports storage)
  charts: chart.js, recharts
  animations: framer-motion
  camera: react-webcam, native MediaDevices API
  pdf: jspdf
  icons: lucide-react, react-icons

pages:
  - path: "/"
    name: Home
    description: Landing page with Hero, Features, HowItWorks, Stats, Footer components
  - path: "/login"
    name: Login
    description: Email/password login form with Google OAuth option. Checks email verification status.
  - path: "/register"
    name: Register
    description: New user registration with email/password via Firebase
  - path: "/scan"
    name: Scan
    description: Live camera feed using getUserMedia, rPPG face scanning for health metrics (heart rate, blood pressure, oxygen, stress). Accepts age, sleep hours, stress level inputs.
  - path: "/dashboard"
    name: Dashboard
    description: Displays user health data with charts and health cards
  - path: "/report"
    name: Report
    description: View the latest health report with details
  - path: "/history"
    name: ReportHistory
    description: View all historical health reports from Supabase
  - path: "/about"
    name: About
    description: About page describing the application

components:
  - Navbar: Navigation with links to all pages
  - Hero: Landing page hero section
  - Features: Feature highlights
  - HowItWorks: Step-by-step explanation
  - Stats: Statistics display
  - HealthCard: Individual health metric display card
  - HealthChart: Chart component for health data visualization
  - Footer: Page footer

services:
  - authService: Firebase authentication (signIn, signInWithGoogle, signOut, sendVerificationEmail, register)
  - reportService: Supabase CRUD for health reports

context:
  - HealthContext: Global state for health scan data (heartRate, bloodPressure, oxygen, stress, healthScore, risk)

features:
  - User registration and login with email/password
  - Google OAuth sign-in
  - Email verification enforcement
  - AI health scan via camera (rPPG signal processing)
  - Health metric display (heart rate, blood pressure, SpO2, stress)
  - Health score calculation with age/sleep/stress adjustments
  - Report saving to Supabase
  - Report history viewing
  - PDF export of reports
  - Charts and visualizations
